version: 0.2

phases:
  build:
    commands:
      - echo "Deploying to EC2"
      - mkdir -p ~/.ssh
      - echo "$PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@13.201.120.69 "echo CONNECTED"
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@13.201.120.69 "bash -s" < deploy.sh
